services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greenhouse}
      POSTGRES_USER: ${POSTGRES_USER:-greenhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenhouse}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-greenhouse} -d ${POSTGRES_DB:-greenhouse}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./apps/backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://greenhouse:greenhouse@postgres:5432/greenhouse}
      ENABLE_OPENAPI: "true"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: [./apps/backend:/app]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  frontend:
    build:
      context: ./apps/frontend
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/api/v1/ws/measurements
    volumes: [./apps/frontend:/app, /app/node_modules]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  postgres_data:
